<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="ChatPassport icon">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"/>
      <feFlood flood-color="#fffdf7" flood-opacity="0.72" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="halo"/>
      <feMerge><feMergeNode in="halo"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="passport"><rect x="16" y="16" width="96" height="96" rx="18"/></clipPath>
  </defs>
  <g filter="url(#glow)">
    <rect x="16" y="16" width="96" height="96" rx="18" fill="#164c3a"/>
    <g clip-path="url(#passport)">
      <rect x="16" y="100" width="96" height="12" fill="#c6923a"/>
      <path d="M39 43h50a8 8 0 0 1 8 8v26a8 8 0 0 1-8 8H65L50 96V85H39a8 8 0 0 1-8-8V51a8 8 0 0 1 8-8Z" fill="#fffdf7" fill-opacity="0.13" stroke="#fffdf7" stroke-width="4" stroke-linejoin="round"/>
    </g>
    <text x="64" y="72" fill="#fffdf7" text-anchor="middle" font-family="Georgia,Times New Roman,serif" font-size="30" font-weight="700" letter-spacing="-2">CP</text>
  </g>
</svg>
